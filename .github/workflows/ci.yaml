
# CI for Product Catalog Service


name: Go Product Catalog CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Go Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: src/product-catalog/go.sum

      - name: Compile application
        working-directory: src/product-catalog
        run: |
          go mod download
          go build -o product-catalog-service main.go

      - name: Execute unit tests
        working-directory: src/product-catalog
        run: go test ./...

  code-quality:
    name: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Analyze Go code
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: src/product-catalog

  docker:
    name: Build and Publish Container
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publish container image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run.id }}

  
  updatek8s:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update tag in Kubernetes deployment manifest
        env:
          IMAGE_TAG: ${{ github.run_id }}
        run: |
          sed -i "s|image: .*product-catalog:.*|image: devopssec123/product-catalog:$IMAGE_TAG|" kubernetes/productcatalog/deploy.yaml

      - name: Commit manifest update
        run: |
          git config user.name "iamdeborah-Q"
          git config user.email "deboraquaye@yahoo.com"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "ci: update product catalog image tag"
          git push origin HEAD:main
